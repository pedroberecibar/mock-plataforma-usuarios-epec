# pyproject.toml — Configuración para proyectos PYTHON
# Si tu stack no es Python, eliminá este archivo.
# Adaptará las versiones y dependencias según el proyecto real.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plataforma-clientes-epec"
version = "0.1.0"
description = "Plataforma de Clientes EPEC — backend FastAPI"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "oracledb>=1.4",
]

[tool.uv]
# Aplicación, no librería: no construir wheel (no hay paquete instalable todavía).
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "deptry>=0.16",
]

# =============================================================================
# Ruff — linter + formatter (reemplaza flake8 + black + isort)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/infrastructure/sqlite/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (ya lo maneja line-length)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["src", "application", "domain", "infrastructure", "interface"]

# =============================================================================
# mypy — type checker
# =============================================================================
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", ".claude/"]

# =============================================================================
# pytest — test runner
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--no-header",
    "--strict-markers",
]
markers = [
    "unit: pure unit tests, no I/O",
    "integration: tests that touch DB or external services",
    "slow: tests that take more than 1 second",
]

# Coverage
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", ".claude/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# =============================================================================
# deptry — detecta dependencias no declaradas y huérfanas
# =============================================================================
[tool.deptry]
# uvicorn: servidor ASGI invocado por CLI, nunca importado en código.
# aiosqlite: driver async seleccionado vía el esquema de DATABASE_URL (sqlite+aiosqlite),
# nunca importado directamente — lo usa SQLAlchemy internamente.
per_rule_ignores = { DEP002 = ["uvicorn", "aiosqlite"] }
ignore_notebooks = true
