<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPEC — Plataforma de Clientes</title>
    <!-- EPEC Design System typography — aligned with Stitch Desktop -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Hanken Grotesk: body/display/headline. Space Grotesk: kWh numeric. JetBrains Mono: labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #f8f9fa;
        font-family: 'Hanken Grotesk', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      /* AppShell responsive nav */
      .app-sidebar   { display: flex; }
      .app-bottomnav { display: none; }
      @media (max-width: 767px) {
        .app-sidebar   { display: none; }
        .app-bottomnav { display: flex; }
      }
      /* LoginPage: left decorative panel hidden on mobile */
      .login-panel-left { display: flex; }
      @media (max-width: 767px) {
        .login-panel-left { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
