<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral Gray Scale" subtitle="11-step neutral gray scale from 900→white" viewport="700x120" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; font-family: 'Roboto', sans-serif; background: #f5f7f6; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatch { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .chip { width: 60px; height: 48px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.07); }
  .label { font-size: 10px; font-weight: 600; color: #4a5550; line-height: 1.2; }
  .hex { font-size: 10px; color: #6b7772; font-family: monospace; }
  .section { font-size: 11px; font-weight: 700; color: #124e2f; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; margin-top: 4px; }
</style></head><body>
<div class="section">Neutral Gray Scale</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#111614"></div><div class="label">900</div><div class="hex">#111614</div></div>
  <div class="swatch"><div class="chip" style="background:#1e2421"></div><div class="label">800</div><div class="hex">#1e2421</div></div>
  <div class="swatch"><div class="chip" style="background:#2f3733"></div><div class="label">700</div><div class="hex">#2f3733</div></div>
  <div class="swatch"><div class="chip" style="background:#4a5550"></div><div class="label">600</div><div class="hex">#4a5550</div></div>
  <div class="swatch"><div class="chip" style="background:#6b7772"></div><div class="label">500</div><div class="hex">#6b7772</div></div>
  <div class="swatch"><div class="chip" style="background:#8f9c97"></div><div class="label">400</div><div class="hex">#8f9c97</div></div>
  <div class="swatch"><div class="chip" style="background:#b5bfbb"></div><div class="label">300</div><div class="hex">#b5bfbb</div></div>
  <div class="swatch"><div class="chip" style="background:#d5ddd9"></div><div class="label">200</div><div class="hex">#d5ddd9</div></div>
  <div class="swatch"><div class="chip" style="background:#eaeeec"></div><div class="label">100</div><div class="hex">#eaeeec</div></div>
  <div class="swatch"><div class="chip" style="background:#f5f7f6"></div><div class="label">50</div><div class="hex">#f5f7f6</div></div>
  <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="label">White</div><div class="hex">#ffffff</div></div>
</div>
</body></html>
