  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { padding: 16px 20px; font-family: 'Roboto', sans-serif; background: #f5f7f6; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 12px; }
  thead { background: #124e2f; color: white; }
  th { padding: 9px 12px; text-align: left; font-weight: 600; font-size: 11px; letter-spacing: 0.03em; }
  td { padding: 8px 12px; border-bottom: 1px solid #eaeeec; color: #2f3733; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #edf5f0; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; }
