<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic Status Colors" subtitle="Success, warning, error, info — with light/dark variants and badge examples" viewport="700x120" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; font-family: 'Roboto', sans-serif; background: #f5f7f6; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { border-radius: 6px; overflow: hidden; border: 1px solid rgba(0,0,0,0.07); }
  .top { height: 44px; display: flex; align-items: center; justify-content: center; }
  .bot { background: white; padding: 6px 8px; }
  .name { font-size: 11px; font-weight: 700; color: #2f3733; }
  .hex { font-size: 10px; color: #6b7772; font-family: monospace; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
</style></head><body>
<div class="grid">
  <div class="card">
    <div class="top" style="background:#1d8348"><span class="badge" style="background:#d4edda;color:#155a2e">Activo</span></div>
    <div class="bot"><div class="name">Success</div><div class="hex">#1d8348</div></div>
  </div>
  <div class="card">
    <div class="top" style="background:#e6910a"><span class="badge" style="background:#fff3cd;color:#7a4a00">Pendiente</span></div>
    <div class="bot"><div class="name">Warning</div><div class="hex">#e6910a</div></div>
  </div>
  <div class="card">
    <div class="top" style="background:#c0392b"><span class="badge" style="background:#fde8e8;color:#7a1c1c">Error</span></div>
    <div class="bot"><div class="name">Error</div><div class="hex">#c0392b</div></div>
  </div>
  <div class="card">
    <div class="top" style="background:#1565c0"><span class="badge" style="background:#dbeafe;color:#0d4272">Información</span></div>
    <div class="bot"><div class="name">Info</div><div class="hex">#1565c0</div></div>
  </div>
</div>
</body></html>
