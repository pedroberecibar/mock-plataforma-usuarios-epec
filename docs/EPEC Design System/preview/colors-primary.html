<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary Green Scale" subtitle="10-step green palette from 900→50, brand primary #124e2f highlighted" viewport="700x120" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; font-family: 'Roboto', sans-serif; background: #f5f7f6; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatch { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .chip { width: 60px; height: 48px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.07); }
  .label { font-size: 10px; font-weight: 600; color: #4a5550; line-height: 1.2; }
  .hex { font-size: 10px; color: #6b7772; font-family: monospace; }
  .section { font-size: 11px; font-weight: 700; color: #124e2f; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; margin-top: 4px; }
</style></head><body>
<div class="section">Primary Green Scale</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#0a2e1b"></div><div class="label">900</div><div class="hex">#0a2e1b</div></div>
  <div class="swatch"><div class="chip" style="background:#0f3d24"></div><div class="label">800</div><div class="hex">#0f3d24</div></div>
  <div class="swatch"><div class="chip" style="background:#124e2f; outline: 2px solid #124e2f; outline-offset:2px"></div><div class="label">700 ★</div><div class="hex">#124e2f</div></div>
  <div class="swatch"><div class="chip" style="background:#1a6640"></div><div class="label">600</div><div class="hex">#1a6640</div></div>
  <div class="swatch"><div class="chip" style="background:#227d50"></div><div class="label">500</div><div class="hex">#227d50</div></div>
  <div class="swatch"><div class="chip" style="background:#3a9e6e"></div><div class="label">400</div><div class="hex">#3a9e6e</div></div>
  <div class="swatch"><div class="chip" style="background:#6dbf97"></div><div class="label">300</div><div class="hex">#6dbf97</div></div>
  <div class="swatch"><div class="chip" style="background:#a8d9c0"></div><div class="label">200</div><div class="hex">#a8d9c0</div></div>
  <div class="swatch"><div class="chip" style="background:#d4eedd"></div><div class="label">100</div><div class="hex">#d4eedd</div></div>
  <div class="swatch"><div class="chip" style="background:#edf5f0"></div><div class="label">50</div><div class="hex">#edf5f0</div></div>
</div>
</body></html>
