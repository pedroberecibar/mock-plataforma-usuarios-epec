<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Tokens" subtitle="4px base grid — visual scale 4–64px with usage labels" viewport="700x130" -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { padding: 16px 20px; font-family: 'Roboto', sans-serif; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { border-radius: 3px; background: #124e2f; width: 100%; }
  .lbl { font-size: 9px; color: #6b7772; font-family: monospace; }
  .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
  .ex { background: #edf5f0; border-radius: 4px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #2f3733; }
  .ex .dot { border-radius: 3px; background: #124e2f; }
</style></head><body>
  <div class="grid">
    <div class="cell"><div class="bar" style="height:4px"></div><div class="lbl">4</div></div>
    <div class="cell"><div class="bar" style="height:8px"></div><div class="lbl">8</div></div>
    <div class="cell"><div class="bar" style="height:12px"></div><div class="lbl">12</div></div>
    <div class="cell"><div class="bar" style="height:16px"></div><div class="lbl">16</div></div>
    <div class="cell"><div class="bar" style="height:20px"></div><div class="lbl">20</div></div>
    <div class="cell"><div class="bar" style="height:24px"></div><div class="lbl">24</div></div>
    <div class="cell"><div class="bar" style="height:32px"></div><div class="lbl">32</div></div>
    <div class="cell"><div class="bar" style="height:40px"></div><div class="lbl">40</div></div>
    <div class="cell"><div class="bar" style="height:48px"></div><div class="lbl">48</div></div>
    <div class="cell"><div class="bar" style="height:64px"></div><div class="lbl">64</div></div>
  </div>
  <div class="row2">
    <div class="ex"><div class="dot" style="width:4px;height:16px"></div>gap-1 · 4px</div>
    <div class="ex"><div class="dot" style="width:8px;height:16px"></div>gap-2 · 8px</div>
    <div class="ex"><div class="dot" style="width:16px;height:16px"></div>gap-4 · 16px</div>
    <div class="ex"><div class="dot" style="width:24px;height:16px"></div>gap-6 · 24px</div>
    <div class="ex"><div class="dot" style="width:32px;height:16px"></div>gap-8 · 32px</div>
  </div>
</body></html>
