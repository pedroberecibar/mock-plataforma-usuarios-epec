name: Deploy demo to GitHub Pages

on:
  workflow_dispatch: # deploy manual desde GitHub UI
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "frontend/public/mock-data/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build demo
        run: npm run build:demo
        working-directory: frontend

      # Las fixtures JSON ya están commiteadas en frontend/public/mock-data/
      # — no se necesita Python ni la DB en CI.

      - name: Deploy to mock-plataforma-usuarios-epec
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Requiere un secret DEMO_REPO_TOKEN con acceso a
          # pedroberecibar/mock-plataforma-usuarios-epec
          personal_token: ${{ secrets.DEMO_REPO_TOKEN }}
          external_repository: pedroberecibar/mock-plataforma-usuarios-epec
          publish_branch: mock-platform
          publish_dir: frontend/dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(demo): rebuild from ${{ github.sha }}"
