<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPEC — Plataforma de Clientes</title>
    <!-- EPEC Design System typography — Inter (variable) + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #F8F6F2;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      /* AppShell responsive nav */
      .app-sidebar   { display: flex; }
      .app-bottomnav { display: none; }
      @media (max-width: 767px) {
        .app-sidebar   { display: none; }
        .app-bottomnav { display: flex; }
      }
      /* LoginPage: left decorative panel hidden on mobile; right panel fills full width */
      .login-panel-left { display: flex; }
      .login-panel-right { width: 50%; }
      @media (max-width: 767px) {
        .login-panel-left  { display: none; }
        .login-panel-right { width: 100%; padding: 40px 24px !important; }
      }
      /* CU-C07: Exportar CSV visible solo en viewport web (≥ 768px) */
      @media (min-width: 768px) {
        .export-csv-btn { display: inline-flex !important; align-items: center; gap: 6px; }
      }
    </style>
    <script type="module" crossorigin src="/mock-plataforma-usuarios-epec/assets/index-dtQIxt-D.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
