<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPEC — Plataforma de Clientes</title>
    <!-- EPEC Design System typography — Inter (variable) + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #F8F6F2;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      /* AppShell responsive nav */
      .app-sidebar   { display: flex; }
      .app-topbar    { display: none; }
      .app-content   { margin-left: 256px; }
      @media (max-width: 767px) {
        .app-sidebar   { display: none; }
        .app-topbar    { display: flex; }
        .app-content   { margin-left: 0; padding-top: 60px; }
      }
      /* Page transition — fade between views */
      @keyframes pageFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .page-fade { animation: pageFadeIn 200ms ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .page-fade, .drawer-panel-anim { animation: none; }
      }
      /* Mobile drawer — slide in from the left */
      @keyframes drawerSlideIn {
        from { transform: translateX(-100%); }
        to   { transform: translateX(0); }
      }
      .drawer-panel-anim { animation: drawerSlideIn 200ms ease-out; }
      /* LoginPage: left decorative panel hidden on mobile; right panel fills full width */
      .login-panel-left { display: flex; }
      .login-panel-right { width: 50%; }
      /* El logo vive en el panel izquierdo. En el derecho solo aparece en mobile,
         donde ese panel se oculta, para no duplicar la marca en desktop. */
      .login-logo-mobile { display: none; }
      /* El panel izquierdo (logo + progreso del alta) se oculta en mobile: estos
         elementos lo reemplazan para no dejar al usuario sin contexto. */
      .auth-mobile-only { display: none; }
      @media (max-width: 767px) {
        .login-panel-left  { display: none; }
        .login-panel-right { width: 100%; padding: 40px 24px !important; }
        .login-logo-mobile { display: block; }
        .auth-mobile-only  { display: block; }
      }
      /* Foco visible en los formularios de auth: los inputs llevan outline:none inline,
         así que sin esto la navegación por teclado queda sin indicador. */
      .login-panel-right input:focus-visible {
        border-color: #165131;
        box-shadow: 0 0 0 3px rgba(22, 81, 49, 0.15);
        outline: none;
      }
      .login-panel-right input::placeholder { color: #8C7A63; }
      .auth-submit:hover:not(:disabled) { background: #00361d !important; }
      .auth-submit:active:not(:disabled) { transform: translateY(1px); }
      /* Contenido solo para lectores de pantalla y navegacion por teclado.
         El grafico lo usa para exponer un boton por punto y la tabla alternativa:
         las barras de Recharts no son focusables, asi que sin esto la unica forma
         de bajar a un dia era el mouse (fallaba WCAG 2.1.1). */
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      /* Al recibir foco por teclado, el boton del punto se vuelve visible. */
      .sr-only-focusable:focus-visible {
        position: static;
        width: auto; height: auto;
        margin: 0;
        overflow: visible;
        clip: auto;
        clip-path: none;
        white-space: normal;
        padding: 4px 8px;
        background: #FDFCF9;
        border: 1px solid #124e2f;
        border-radius: 4px;
      }
      /* Anillo de foco de marca para controles interactivos custom (breadcrumb, chips de hitos) */
      .focus-ring:focus-visible {
        outline: 2px solid #165131;
        outline-offset: 2px;
        border-radius: 4px;
      }
      /* Dashboard de Consumo en tres capas de ancho completo:
         1) la respuesta  2) la evidencia (gráfico)  3) el detalle comparable.
         Se eliminó el rail de 340 px: dejaba el lienzo angosto, el borde inferior
         desalineado y ~250 px de página vacía al pie. */
      .consumo-grid  { display: grid; gap: 24px; align-items: start;
                       grid-template-areas: "resumen" "chart" "cards"; }
      .cg-resumen    { grid-area: resumen; min-width: 0; }
      .cg-chart      { grid-area: chart; min-width: 0; }
      .cg-cards      { grid-area: cards; display: grid; gap: 16px; align-items: stretch;
                       grid-template-columns: repeat(3, minmax(0, 1fr)); }
      @media (max-width: 899px) {
        .cg-cards    { grid-template-columns: 1fr; }
      }
    </style>
    <script type="module" crossorigin src="/mock-plataforma-usuarios-epec/assets/index-uA9P4wx3.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
