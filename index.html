<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPEC — Plataforma de Clientes</title>
    <!-- EPEC Design System typography — Inter (variable) + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #F8F6F2;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      /* AppShell responsive nav */
      .app-sidebar   { display: flex; }
      .app-topbar    { display: none; }
      .app-content   { margin-left: 256px; }
      @media (max-width: 767px) {
        .app-sidebar   { display: none; }
        .app-topbar    { display: flex; }
        .app-content   { margin-left: 0; padding-top: 60px; }
      }
      /* Page transition — fade between views */
      @keyframes pageFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .page-fade { animation: pageFadeIn 200ms ease-out; }
      @media (prefers-reduced-motion: reduce) {
        .page-fade, .drawer-panel-anim { animation: none; }
      }
      /* Mobile drawer — slide in from the left */
      @keyframes drawerSlideIn {
        from { transform: translateX(-100%); }
        to   { transform: translateX(0); }
      }
      .drawer-panel-anim { animation: drawerSlideIn 200ms ease-out; }
      /* LoginPage: left decorative panel hidden on mobile; right panel fills full width */
      .login-panel-left { display: flex; }
      .login-panel-right { width: 50%; }
      @media (max-width: 767px) {
        .login-panel-left  { display: none; }
        .login-panel-right { width: 100%; padding: 40px 24px !important; }
      }
      /* Anillo de foco de marca para controles interactivos custom (breadcrumb, chips de hitos) */
      .focus-ring:focus-visible {
        outline: 2px solid #165131;
        outline-offset: 2px;
        border-radius: 4px;
      }
      /* ConsumoPage — dashboard: lienzo + ancla de números arriba, fila de seguimiento full-width abajo.
         Sin sticky en el ancla: con el layout compacto no aportaba fijado real y provocaba que la fila
         de cards de abajo se solapara con el ancla al scrollear. Todo scrollea como un solo plano. */
      .consumo-grid  { display: grid; gap: 24px; align-items: start;
                       grid-template-columns: minmax(0, 1fr) 340px;
                       grid-template-areas: "chart anchor" "cards cards"; }
      .cg-chart      { grid-area: chart; min-width: 0; }
      .cg-anchor     { grid-area: anchor;
                       display: flex; flex-direction: column; gap: 16px; }
      .cg-cards      { grid-area: cards; display: grid; gap: 16px; align-items: start;
                       grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      @media (max-width: 1199px) {
        .consumo-grid { grid-template-columns: 1fr;
                        grid-template-areas: "anchor" "chart" "cards"; }
        .cg-anchor    { display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      }
    </style>
    <script type="module" crossorigin src="/mock-plataforma-usuarios-epec/assets/index-BhMEBpXr.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
